name: Harvest Dropped Domains

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: harvest-drops
  cancel-in-progress: false

jobs:
  harvest:
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/harvest-drops.mjs

      - name: Commit snapshot if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/dropped.snapshot.json
          if ! git diff --quiet --cached -- src/config/dropped.snapshot.json; then
            git commit -m "chore: update dropped-domains snapshot"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: harvest
    if: needs.harvest.outputs.updated == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      checkout_ref: main
