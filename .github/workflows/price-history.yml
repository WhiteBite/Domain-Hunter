name: Price History

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: price-history
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/build-price-history.mjs

      - name: Commit history if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/price-history.json src/config/pricing.snapshot.json
          if ! git diff --quiet --cached -- src/config/price-history.json src/config/pricing.snapshot.json; then
            git commit -m "chore: update price history + trends (weekly)"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: build
    if: needs.build.outputs.updated == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      checkout_ref: main
