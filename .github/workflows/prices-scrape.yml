name: Harvest Prices (Full Scrape)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: harvest-prices
  cancel-in-progress: false

jobs:
  # Manual, non-collecting reachability check. Do not request disallowed cart
  # pages, follow redirects or bypass anti-bot controls. A HEAD response does
  # not grant scraping permission or prove that parsing a GET will succeed.
  source-reachability:
    if: github.event_name == 'workflow_dispatch'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Check public endpoints
        run: |
          for url in \
            https://my.hostiman.ru/domain/register \
            https://timeweb.com/ru/services/domains/ \
            https://sprinthost.ru/tariffs/domain-prices \
            https://webhost1.ru/domains/ru \
            https://adminvps.ru/domains/xyz.php; do
            echo "HEAD $url"
            curl --head --silent --show-error --max-time 20 --output /dev/null \
              --write-out 'HTTP %{http_code}\n' "$url" || echo 'unreachable'
          done

  harvest:
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/harvest-prices.mjs

      - name: Commit snapshot if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/pricing.snapshot.json
          if ! git diff --quiet --cached -- src/config/pricing.snapshot.json; then
            git commit -m "chore: update pricing snapshot (daily full scrape)"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: harvest
    if: needs.harvest.outputs.updated == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      checkout_ref: main
