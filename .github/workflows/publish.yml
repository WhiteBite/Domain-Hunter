name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck && npm run test:coverage && npm run lint

      # Tokenless OIDC trusted publishing; Node 24 bundles npm >= 11.5.1 (required). prepack runs build:cli.
      - run: npm publish --access public
