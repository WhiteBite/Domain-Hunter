name: Harvest Prices

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-prices
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/harvest-prices.mjs --api-only

      # Delta gate: scripts/snapshot-gate.mjs skips commits under 0.5% cell change within 24h.
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/pricing.snapshot.json
          if git diff --quiet --cached -- src/config/pricing.snapshot.json; then
            echo "snapshot unchanged"
            exit 0
          fi
          if node scripts/snapshot-gate.mjs; then
            git commit -m "chore: update pricing snapshot (6h API)"
            git push
          else
            echo "delta below gate, skipping commit"
          fi
